name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaes
          POSTGRES_PASSWORD: kaes
          POSTGRES_DB: kaes_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kaes"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      # Instala la versión de pnpm fijada en backend/package.json ("packageManager").
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: backend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: backend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validar schema de Prisma (variables ficticias)
        run: pnpm exec prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
      - name: Generar cliente de Prisma (variables ficticias)
        run: pnpm exec prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
      - name: Tests unitarios e integración (mocks)
        run: pnpm test
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
      - name: Tests contra PostgreSQL real (pagos, stock, concurrencia)
        run: pnpm run test:db
        env:
          TEST_DATABASE_URL: postgresql://kaes:kaes@localhost:5432/kaes_test
      - name: Migraciones sin drift respecto al schema
        env:
          DATABASE_URL: postgresql://kaes:kaes@localhost:5432/kaes_test
          DIRECT_URL: postgresql://kaes:kaes@localhost:5432/kaes_test
        run: pnpm exec prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Auditoría de dependencias
        run: pnpm audit --audit-level high --prod

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      # Instala la versión de pnpm fijada en frontend/package.json ("packageManager").
      - uses: pnpm/action-setup@v6
        with:
          package_json_file: frontend/package.json
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
          cache-dependency-path: frontend/pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm test
      - run: pnpm run build
        env:
          PUBLIC_API_URL: https://api.example.com/api/v1
      # Empaqueta el Worker sin publicarlo: falla si supera el límite de tamaño
      # de Cloudflare (3 MB comprimido en el plan gratuito).
      - name: Validar Worker de Cloudflare
        run: pnpm exec wrangler deploy --dry-run
        env:
          WRANGLER_SEND_METRICS: 'false'
      - name: Auditoría de dependencias
        run: pnpm audit --audit-level high --prod
