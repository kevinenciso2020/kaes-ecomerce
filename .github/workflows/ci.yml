name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: kaes
          POSTGRES_PASSWORD: kaes
          POSTGRES_DB: kaes_test
        ports: ['5432:5432']
        options: >-
          --health-cmd "pg_isready -U kaes"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - run: npm ci
      - name: Validar schema de Prisma (variables ficticias)
        run: npx prisma validate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
      - name: Generar cliente de Prisma (variables ficticias)
        run: npx prisma generate
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
      - name: Tests unitarios e integración (mocks)
        run: npm test
        env:
          DATABASE_URL: postgresql://user:pass@localhost:5432/db
          DIRECT_URL: postgresql://user:pass@localhost:5432/db
      - name: Tests contra PostgreSQL real (pagos, stock, concurrencia)
        run: npm run test:db
        env:
          TEST_DATABASE_URL: postgresql://kaes:kaes@localhost:5432/kaes_test
      - name: Migraciones sin drift respecto al schema
        env:
          DATABASE_URL: postgresql://kaes:kaes@localhost:5432/kaes_test
          DIRECT_URL: postgresql://kaes:kaes@localhost:5432/kaes_test
        run: npx prisma migrate diff --from-url "$DATABASE_URL" --to-schema-datamodel prisma/schema.prisma --exit-code
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high --omit=dev

  frontend:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npm test
      - run: npm run build
        env:
          PUBLIC_API_URL: https://api.example.com/api/v1
      - name: Auditoría de dependencias
        run: npm audit --audit-level=high --omit=dev
